name: refresh activity SVGs

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate contrib + shipping SVGs
        env:
          GH_TOKEN: ${{ secrets.ACTIVITY_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "ACTIVITY_PAT secret missing — using GITHUB_TOKEN (public-ish only)"
            export GH_TOKEN="${{ secrets.GITHUB_TOKEN }}"
          fi
          node scripts/gen-contrib-grid.mjs
          node scripts/gen-shipping.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contrib-year.svg assets/contrib-year.json assets/shipping-year.svg || true
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit --trailer "Co-authored-by: Cursor <cursoragent@cursor.com>" -m "chore(profile): refresh activity SVGs"
          git push
